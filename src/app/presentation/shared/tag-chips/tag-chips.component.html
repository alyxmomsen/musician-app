<div class="tag-chips">
  @for (tag of tags(); track tag.id) {
    <span
      class="tag-chip"
      [pTooltip]="tag.description || 'Найти всё с этим тегом'"
      [tooltipDisabled]="false"
      tooltipPosition="top"
      style="cursor: pointer"
      (click)="onTagClick(tag, $event)"
    >
      <span class="tag-text">{{ tag.originalText }}</span>
      <button
        type="button"
        class="tag-remove"
        (click)="removeTagById(tag.id); $event.stopPropagation()"
      >
        <i class="pi pi-times"></i>
      </button>
      @if (canEditDescription(tag)) {
        <button
          type="button"
          class="tag-edit"
          (click)="startEditDescription(tag); $event.stopPropagation()"
          pTooltip="Описание"
        >
          <i class="pi pi-pencil"></i>
        </button>
      }
    </span>
  }

  @if (!adding()) {
    <button type="button" class="tag-add" (click)="startAdd()">
      <i class="pi pi-plus"></i>
      <span>Тег</span>
    </button>
  } @else {
    <div class="tag-add-form">
      <input
        pInputText
        type="text"
        [ngModel]="newTagText()"
        (ngModelChange)="newTagText.set($event)"
        (keydown)="onKeydown($event)"
        placeholder="тег (пробел — разделитель)"
        class="tag-input"
        autofocus
      />
      <input
        pInputText
        type="text"
        [ngModel]="newDescription()"
        (ngModelChange)="newDescription.set($event)"
        placeholder="что значит (опционально)"
        class="tag-description-input"
      />
      <div class="tag-add-actions">
        <p-button
          icon="pi pi-check"
          size="small"
          [text]="true"
          [loading]="saving()"
          [disabled]="!newTagText().trim()"
          (onClick)="submitAdd()"
        />
        <p-button
          icon="pi pi-times"
          size="small"
          severity="secondary"
          [text]="true"
          (onClick)="cancelAdd()"
        />
      </div>
    </div>
  }

  @if (editingDescriptionFor(); as tagId) {
    <div class="tag-description-edit-overlay" (click)="cancelEditDescription()">
      <div class="tag-description-edit" (click)="$event.stopPropagation()">
        <textarea
          pTextarea
          rows="3"
          [ngModel]="editDescription()"
          (ngModelChange)="editDescription.set($event)"
          placeholder="Что значит этот тег?"
        ></textarea>
        <div class="tag-description-edit-actions">
          <p-button
            label="Сохранить"
            icon="pi pi-check"
            [loading]="savingDescription()"
            (onClick)="submitEditDescription(tagId)"
          />
          <p-button
            label="Отмена"
            icon="pi pi-times"
            severity="secondary"
            [text]="true"
            (onClick)="cancelEditDescription()"
          />
        </div>
      </div>
    </div>
  }
</div>
