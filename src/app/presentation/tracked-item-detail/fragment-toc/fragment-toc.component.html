<aside class="toc">
  <div class="toc-header">Фрагменты</div>

  @if (items.length === 0) {
    <div class="toc-empty">Нет фрагментов</div>
  }

  <ul class="toc-list">
    @for (item of items; track item.id) {
      <li
        class="toc-item"
        [class.done]="item.isDone"
        (click)="onClick(item.id)"
      >
        <span class="toc-label">{{ item.label }}</span>
        <div class="toc-indicators">
          @if (item.commentCount > 0) {
            <span class="toc-indicator" title="Комментарии">
              <i class="pi pi-comment"></i>{{ item.commentCount }}
            </span>
          }
          @if (item.tagCount > 0) {
            <span class="toc-indicator" title="Теги">
              <i class="pi pi-tag"></i>{{ item.tagCount }}
            </span>
          }
        </div>
      </li>
    }
  </ul>
</aside>
