<aside class="context-panel" [class.open]="open">
  <div class="context-header">
    <span class="context-title">{{ title || 'Контекст' }}</span>
    <p-button
      icon="pi pi-times"
      [text]="true"
      severity="secondary"
      size="small"
      (onClick)="onClose()"
    />
  </div>

  @if (subtitle) {
    <div class="context-subtitle">{{ subtitle }}</div>
  }

  <div class="context-body">
    <div class="context-empty">
      Содержимое появится в следующей части
    </div>
  </div>
</aside>
